:root {

  (async function () {
    var r = Q.get('r') || 'brand', p = r.split(':');

    await document.fonts.ready;
    window.WORDMARK = await (await fetch('/brand/wordmark.svg')).text();
    H.lang = I18N.lang;
    var S = K.stage(), out;
    if (p[0] === 'quiz') out = REELS.quiz(S, p[1], p[2] || 'same');
    else if (p[0] === 'countdown') out = REELS.countdown(S, p[1]);
    else if (p[0] === 'ui') out = await UI.reel(S);
    else if (p[0] === 'car') out = CAR.slide(S, p[1], +p[2]);
    else if (p[0] === 'kit') out = KIT.make(S, p[1]);
    else out = REELS[p[0]](S);
    window.OUT = { T: K.T, cuts: out && out.cuts, texts: H.texts, w: S.offsetWidth, h: S.offsetHeight };

    K.seek(+(Q.get('t') || 0));
    window.READY = true;
  })();
